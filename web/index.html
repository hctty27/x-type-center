<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Type Center</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">X</div>
        <div>
          <h1>X Type Center</h1>
          <span>跨项目全局类型注册中心 · author by openai,hc</span>
        </div>
      </div>

      <a
        id="skillDownloadButton"
        class="download-button disabled"
        aria-disabled="true"
        title="正在检查技能包">
        <span aria-hidden="true">↓</span>
        下载技能包
      </a>
    </header>

    <main class="dashboard">
      <section class="panel namespace-panel">
        <div class="panel-header">
          <div>
            <h2>Namespace</h2>
            <p id="workspaceMeta">加载中...</p>
          </div>
          <div class="panel-header-actions">
            <div class="namespace-search">
              <input id="searchInput" autocomplete="off" placeholder="搜索 Namespace、名称、别名或描述">
              <button id="clearSearchButton" class="text-button" type="button">清空</button>
            </div>
            <button id="refreshButton" class="secondary-button" type="button">刷新</button>
          </div>
        </div>

        <div id="namespaceTable" class="table-shell namespace-table-shell"></div>

        <div class="list-footer">
          <label class="page-size-control">
            <span>每页</span>
            <select id="namespacePageSize">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
          <div id="namespacePagination" class="pagination"></div>
        </div>
      </section>

      <aside class="panel allocate-panel">
        <div class="panel-header compact">
          <div>
            <h2>申请新类型</h2>
            <p>选择 Namespace 后即可申请，其他字段均可选。</p>
          </div>
        </div>

        <form id="allocateForm" class="allocate-form">
          <label class="field">
            <span>Namespace</span>
            <div id="namespaceCombo" class="combo">
              <input
                id="allocateNamespaceSearch"
                role="combobox"
                aria-expanded="false"
                aria-autocomplete="list"
                aria-controls="namespaceOptions"
                autocomplete="off"
                placeholder="搜索 Namespace / 名称 / 别名">
              <input id="allocateNamespace" type="hidden">
              <div id="namespaceOptions" class="combo-options" role="listbox" hidden></div>
            </div>
          </label>

          <div class="form-row quantity-row">
            <label class="field">
              <span>申请数量</span>
              <input id="allocateCount" type="number" min="1" max="100" step="1" value="1" inputmode="numeric">
            </label>
            <label class="field">
              <span>项目 <em>可搜索，也可直接输入新项目</em></span>
              <div id="projectCombo" class="combo">
                <input
                  id="project"
                  role="combobox"
                  aria-expanded="false"
                  aria-autocomplete="list"
                  aria-controls="projectOptions"
                  autocomplete="off"
                  maxlength="128"
                  placeholder="搜索或输入项目">
                <div id="projectOptions" class="combo-options" role="listbox" hidden></div>
              </div>
            </label>
          </div>

          <label class="field">
            <span>常量名 <em id="symbolHint">可选</em></span>
            <input id="symbol" placeholder="CHAOS_REALM_RANK">
          </label>

          <label class="field">
            <span>描述 <em>可选</em></span>
            <textarea id="description" placeholder="类型用途说明"></textarea>
          </label>

          <div class="form-row">
            <label class="field">
              <span>需求/工单 <em>可选</em></span>
              <input id="requirement" placeholder="XH2-3124">
            </label>
            <label class="field">
              <span>申请人 <em>可选</em></span>
              <input id="requester" placeholder="姓名 / Git 用户">
            </label>
          </div>

          <button type="submit" class="primary-button">申请可用值</button>
          <div id="allocateResult" class="allocation-feedback is-idle">
            <span class="feedback-placeholder">尚未申请</span>
          </div>
        </form>
      </aside>
    </main>
  </div>

  <dialog id="entryDialog" class="entry-dialog">
    <div class="dialog-shell">
      <header class="dialog-header">
        <div>
          <p class="dialog-kicker">NAMESPACE ENTRIES</p>
          <h2 id="entryDialogTitle">Namespace</h2>
          <p id="entryDialogMeta" class="muted"></p>
        </div>
        <button id="closeEntryDialog" class="icon-button" type="button" aria-label="关闭">×</button>
      </header>

      <div class="alias-toolbar">
        <span class="alias-toolbar-label">别名</span>
        <div id="aliasChips" class="alias-chips"></div>
        <form id="aliasForm" class="alias-form">
          <input id="aliasInput" maxlength="255" autocomplete="off" placeholder="添加别名，例如：商城类型">
          <button type="submit" class="secondary-button">添加</button>
        </form>
        <span id="aliasMessage" class="alias-message"></span>
      </div>

      <div class="entry-toolbar">
        <input id="entrySearchInput" autocomplete="off" placeholder="搜索值、常量名、项目或描述">
        <label class="page-size-control">
          <span>每页</span>
          <select id="entryPageSize">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
      </div>

      <div id="entryTable" class="table-shell entry-table-shell"></div>

      <div class="list-footer dialog-footer">
        <span id="entryCountMeta" class="muted"></span>
        <div id="entryPagination" class="pagination"></div>
      </div>
    </div>
  </dialog>

  <dialog id="revokeDialog" class="revoke-dialog">
    <form id="revokeForm" class="revoke-shell">
      <header class="revoke-header">
        <div>
          <p class="dialog-kicker">REVOKE TYPE</p>
          <h2 id="revokeDialogTitle">撤回类型</h2>
          <p id="revokeDialogMeta" class="muted"></p>
        </div>
        <button id="closeRevokeDialog" class="icon-button" type="button" aria-label="关闭">×</button>
      </header>

      <label class="field">
        <span>撤回人 <em>可选</em></span>
        <input id="revokeRequester" maxlength="128" autocomplete="off" placeholder="姓名 / Git 用户">
      </label>

      <label class="field">
        <span>撤回原因</span>
        <textarea id="revokeReason" maxlength="500" required placeholder="说明为什么需要撤回"></textarea>
      </label>

      <p class="revoke-warning">撤回后该类型值仍永久占用，不会重新分配。</p>
      <p id="revokeMessage" class="revoke-message"></p>

      <div class="revoke-actions">
        <button id="cancelRevokeButton" class="secondary-button" type="button">取消</button>
        <button id="confirmRevokeButton" class="danger-button" type="submit">确认撤回</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
