<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Type Center</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>X Type Center</h1>
      <span>跨项目全局类型注册中心</span>
    </div>

    <div class="global-search">
      <input id="searchInput" autocomplete="off" placeholder="搜索类型值、常量名、描述、项目，例如 RankType / 447">
      <select id="namespaceFilter" aria-label="Namespace 筛选">
        <option value="">全部 Namespace</option>
      </select>
      <button id="searchButton">搜索</button>
      <button id="clearSearchButton" class="secondary">清空</button>
    </div>

  </header>

  <main class="dashboard">
    <section class="panel workspace-panel">
      <div class="panel-title">
        <div>
          <h2>类型列表</h2>
          <span id="workspaceMeta" class="muted">加载中...</span>
        </div>
        <button id="refreshButton" class="secondary compact-button">刷新</button>
      </div>

      <div id="typeTable" class="table-shell"></div>
      <div id="pagination" class="pagination"></div>
    </section>

    <aside class="side-column">
      <section class="panel allocate-panel">
        <div class="panel-title">
          <h2>申请新类型</h2>
          <span class="muted">自动分配下一可用值</span>
        </div>

        <form id="allocateForm" class="allocate-form">
          <div class="form-row">
            <label>Namespace
              <select id="allocateNamespace" required></select>
            </label>
            <label>项目
              <input id="project" required placeholder="XH2 / SLG">
            </label>
          </div>

          <label>常量名
            <input id="symbol" required placeholder="CHAOS_REALM_RANK">
          </label>

          <label>描述
            <textarea id="description" required placeholder="这个类型是做什么的"></textarea>
          </label>

          <div class="form-row">
            <label>需求/工单
              <input id="requirement" placeholder="XH2-3124">
            </label>
            <label>申请人
              <input id="requester" placeholder="姓名 / Git 用户">
            </label>
          </div>

          <div class="submit-row">
            <button type="submit">申请类型</button>
            <pre id="allocateResult" class="result inline-result"></pre>
          </div>
        </form>
      </section>

      <section class="panel detail-panel">
        <div class="panel-title">
          <h2>Namespace 详情</h2>
          <span class="muted">点击列表中的 Namespace</span>
        </div>
        <div id="namespaceDetail" class="detail-empty">点击列表中的 Namespace 查看详情。</div>
      </section>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
