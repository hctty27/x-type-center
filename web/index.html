<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Type Center</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">X</div>
        <div>
          <h1>X Type Center</h1>
          <span>跨项目全局类型注册中心</span>
        </div>
      </div>

      <div class="top-search">
        <input id="searchInput" autocomplete="off" placeholder="搜索 Namespace、名称或描述">
        <button id="clearSearchButton" class="text-button" type="button">清空</button>
      </div>
    </header>

    <main class="dashboard">
      <section class="panel namespace-panel">
        <div class="panel-header">
          <div>
            <h2>Namespace</h2>
            <p id="workspaceMeta">加载中...</p>
          </div>
          <button id="refreshButton" class="secondary-button" type="button">刷新</button>
        </div>

        <div id="namespaceTable" class="table-shell namespace-table-shell"></div>

        <div class="list-footer">
          <label class="page-size-control">
            <span>每页</span>
            <select id="namespacePageSize">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
          <div id="namespacePagination" class="pagination"></div>
        </div>
      </section>

      <aside class="panel allocate-panel">
        <div class="panel-header compact">
          <div>
            <h2>申请新类型</h2>
            <p>选择 Namespace 后即可申请，其他字段均可选。</p>
          </div>
        </div>

        <form id="allocateForm" class="allocate-form">
          <label class="field">
            <span>Namespace</span>
            <div id="namespaceCombo" class="combo">
              <input
                id="allocateNamespaceSearch"
                role="combobox"
                aria-expanded="false"
                aria-autocomplete="list"
                aria-controls="namespaceOptions"
                autocomplete="off"
                placeholder="搜索 Namespace / 名称">
              <input id="allocateNamespace" type="hidden">
              <div id="namespaceOptions" class="combo-options" role="listbox" hidden></div>
            </div>
          </label>

          <div class="form-row">
            <label class="field">
              <span>项目 <em>可选</em></span>
              <input id="project" placeholder="XH2 / SLG">
            </label>
            <label class="field">
              <span>常量名 <em>可选</em></span>
              <input id="symbol" placeholder="CHAOS_REALM_RANK">
            </label>
          </div>

          <label class="field">
            <span>描述 <em>可选</em></span>
            <textarea id="description" placeholder="类型用途说明"></textarea>
          </label>

          <div class="form-row">
            <label class="field">
              <span>需求/工单 <em>可选</em></span>
              <input id="requirement" placeholder="XH2-3124">
            </label>
            <label class="field">
              <span>申请人 <em>可选</em></span>
              <input id="requester" placeholder="姓名 / Git 用户">
            </label>
          </div>

          <button type="submit" class="primary-button">申请下一可用值</button>
          <div id="allocateResult" class="form-result muted">尚未申请</div>
        </form>
      </aside>
    </main>
  </div>

  <dialog id="entryDialog" class="entry-dialog">
    <div class="dialog-shell">
      <header class="dialog-header">
        <div>
          <p class="dialog-kicker">NAMESPACE ENTRIES</p>
          <h2 id="entryDialogTitle">Namespace</h2>
          <p id="entryDialogMeta" class="muted"></p>
        </div>
        <button id="closeEntryDialog" class="icon-button" type="button" aria-label="关闭">×</button>
      </header>

      <div class="entry-toolbar">
        <input id="entrySearchInput" autocomplete="off" placeholder="搜索值、常量名、项目或描述">
        <label class="page-size-control">
          <span>每页</span>
          <select id="entryPageSize">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
      </div>

      <div id="entryTable" class="table-shell entry-table-shell"></div>

      <div class="list-footer dialog-footer">
        <span id="entryCountMeta" class="muted"></span>
        <div id="entryPagination" class="pagination"></div>
      </div>
    </div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
