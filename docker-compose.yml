services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: x_type_center
      MYSQL_USER: type_center
      MYSQL_PASSWORD: type_center
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      TYPE_REGISTRY_ADDR: ":8080"
      TYPE_REGISTRY_DSN: "type_center:type_center@tcp(mysql:3306)/x_type_center?charset=utf8mb4&parseTime=true&loc=UTC"
      TYPE_REGISTRY_TOKEN: "${TYPE_REGISTRY_TOKEN:-}"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
