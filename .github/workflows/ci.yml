name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: go mod tidy
      - name: Print module metadata
        run: |
          echo '---GOMOD---'
          base64 -w0 go.mod
          echo
          echo '---GOSUM---'
          base64 -w0 go.sum
          echo
      - run: test -z "$(find ./cmd ./internal ./web -name '*.go' -print0 | xargs -0 gofmt -l)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/server ./cmd/type-registry ./cmd/import-xlsx
