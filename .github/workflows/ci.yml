name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, cursor]
    env:
      HOME: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: go mod download
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Check gofmt
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find ./cmd ./internal ./web -name '*.go' -print0 | xargs -0 gofmt -l)
          if (( ${#files[@]} > 0 )); then
            printf 'Unformatted Go files:\n'
            printf '  %s\n' "${files[@]}"
            for file in "${files[@]}"; do
              gofmt -d "$file"
            done
            exit 1
          fi
      - run: go vet ./...
      - run: node --check web/app.js
      - run: python3 -m py_compile skills/type-registry/scripts/type_registry.py
      - run: make skill-package && unzip -l dist/type-registry-skill.zip | grep 'type-registry/SKILL.md'
      - run: go test ./...
      - run: go build -o /tmp/x-type-center ./cmd/x-type-center
      - run: go build -o /tmp/type-registry ./cmd/type-registry
      - run: /tmp/x-type-center version

  package:
    runs-on: [self-hosted, Linux, X64, cursor]
    env:
      HOME: ${{ runner.temp }}
    needs: test
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: go mod download
      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="main-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          ARCH="${{ matrix.arch }}"
          COMMIT="${GITHUB_SHA}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PACKAGE="x-type-center-${VERSION}-linux-${ARCH}"
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildTime=${BUILD_TIME}" \
            -o "dist/x-type-center" \
            ./cmd/x-type-center

          tar -C dist -czf "dist/${PACKAGE}.tar.gz" x-type-center
          rm "dist/x-type-center"
          (cd dist && sha256sum "${PACKAGE}.tar.gz" > "${PACKAGE}.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: x-type-center-${{ github.run_number }}-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, cursor]
    env:
      HOME: ${{ runner.temp }}
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: x-type-center-${{ github.run_number }}-linux-*
          path: release-assets
          merge-multiple: true
      - name: Build skill package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          (cd skills && zip -qr ../release-assets/type-registry-skill.zip type-registry)
          (cd release-assets && sha256sum type-registry-skill.zip > type-registry-skill.zip.sha256)
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="main-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          TITLE="X Type Center ${TAG}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --generate-notes \
              --latest
          fi
