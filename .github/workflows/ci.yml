name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: go mod download
      - run: gofmt -w ./cmd ./internal ./web && git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/server ./cmd/type-registry ./cmd/import-xlsx
